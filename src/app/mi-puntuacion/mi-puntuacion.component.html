<ion-grid *ngIf="miPuntuacion.length > 0; else noPuntuaciones">
  <ion-card *ngFor="let p of miPuntuacion">
    <ion-fab style="position: absolute; top: 5px; right: 5px;">
      <ion-fab-button color="terciario" size="small" class="clear-fab">
        <ion-icon name="ellipsis-vertical-outline" id="Elipsis"></ion-icon>
      </ion-fab-button>
      <ion-fab-list side="bottom" style="left: -10px;">
        <ion-text class="report-text">Reportar</ion-text>
      </ion-fab-list>
    </ion-fab>

    <ion-grid style="float: left">
      <ion-row>
        <ion-col>
          <ng-container *ngIf="p.imagenUrlPerfil; else defaultIcon">
            <img [src]="p.imagenUrlPerfil" alt="Profile Image" class="circular-image" style="margin-top: 5px" />
          </ng-container>
          <ng-template #defaultIcon>
            <ion-icon name="person-circle-outline" style="margin-top: 5px" size="large"></ion-icon>
          </ng-template>
        </ion-col>
        <ion-row class="centered-text">
          <p class="nombre-perfil"><i>{{p.nombreUsuario}}</i></p>
          <p class="categoria"><i>{{p.categoria.nombre}}</i></p>
        </ion-row>
      </ion-row>
    </ion-grid>

    <img alt="Imagen" [src]="p.imagenUrlPub ? p.imagenUrlPub : 'https://ionicframework.com/docs/img/demos/card-media.png'" class="ImagenPub"/>
    <ion-title class="titulo" color="primario"><i>{{p.titulo}}</i></ion-title>
    <ion-card-content class="descripcion">
      <div class="right-section">
        <ion-row class="rating-section">
          <ion-col size="12">
            <ion-text class="font-amatic">Valoración:</ion-text>
            <ion-row class="Puntuacion">
              <ion-col size="12" class="stars">
                <img *ngFor="let star of [1, 2, 3, 4, 5]"
                     [class.filled]="star <= p.estrellas"
                     class="star-icon">
              </ion-col>
              <ion-col size="12" class="score">{{ p.estrellas * 5 }} / 25 PTS</ion-col>
            </ion-row>
          </ion-col>
        </ion-row>
      </div>
    </ion-card-content>
  </ion-card>
</ion-grid>

<ng-template #noPuntuaciones>
  <div class="no-publicaciones-container">
    <p>¡Aún no tienes puntuaciones!</p>
  </div>
</ng-template>
