<ion-header>
  <ion-toolbar color="primario">
    <ion-grid style="padding-top: 18px">
      <ion-row>
        <ion-col>
          <ion-menu-button auto-hide="false" style="padding-top: 20px;" class="medium-icon"></ion-menu-button>
        </ion-col>
        <ion-col style="padding-left: 40px">
          <ion-img src="/assets/Meetify.svg" style="width: 60px;"></ion-img>
        </ion-col>
        <ion-col>
          <ion-icon name="search-outline" style="padding-top: 20px; float: right" class="medium-icon" (click)="toggleSearchInput()"></ion-icon>
        </ion-col>
      </ion-row>

      <!-- Input que aparece cuando isSearchVisible es true -->
      <ion-row *ngIf="isSearchVisible" style="background-color: #F3F7F0;color: black">
        <ion-col>
          <ion-input placeholder="Buscar..." [(ngModel)]="searchQuery"></ion-input>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>

<ion-menu side="start" menuId="first" contentId="main-content" style="height: 100%;">
  <ion-header>
    <ion-toolbar color="primario">
      <ion-buttons slot="start">
        <ion-img src="/assets/Meetify.svg" class="large-icon"></ion-img>
      </ion-buttons>
      <ion-title class="header-title font-amatic-grande2">MENÚ</ion-title>
      <ion-buttons slot="end">
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content class="menu-content" style="height: 100%;">
    <div class="menu-items">
      <ion-list *ngIf="vistaActual === 'main'">
        <ion-item *ngFor="let item of menuItems" (click)="navigateTo(item.route)">
          <ion-icon [name]="item.icon" slot="start" class="menu-icon"></ion-icon>
          <ion-label>{{ item.label }}</ion-label>
        </ion-item>
        <ion-item (click)="setVista('config')">
          <ion-icon name="settings-outline" slot="start" class="menu-icon"></ion-icon>
          <ion-label>Mis actividades y configuración</ion-label>
        </ion-item>
      </ion-list>

      <ion-list *ngIf="vistaActual === 'config'">
        <ion-item (click)="setVista('main')">
          <ion-icon name="arrow-back-circle" slot="start" class="menu-icon"></ion-icon>
          <ion-label>Volver</ion-label>
        </ion-item>
        <ion-item *ngFor="let item of menuActivities" (click)="navigateTo(item.route)">
          <ion-icon [name]="item.icon" slot="start" class="menu-icon"></ion-icon>
          <ion-label>{{ item.label }}</ion-label>
        </ion-item>

        <ion-item style="text-align: center">
          <ion-label color="cuarto" (click)="doLogout()">Cerrar Sesion</ion-label>
        </ion-item>
        <ion-item style="text-align: center">
          <ion-label color="cuarto" (click)="openConfirmModal()">Eliminar Cuenta</ion-label>
        </ion-item>
      </ion-list>
    </div>
  </ion-content>
</ion-menu>

<!-- Primer Modal: Confirmación de eliminar cuenta -->
<ion-modal #modalConfirm trigger="open-modal">
  <ng-template>
    <ion-content style="--background: #19323C">
      <ion-toolbar>
        <ion-title>Confirmación</ion-title>
        <ion-buttons slot="end">
          <ion-button color="light" (click)="modalConfirm.dismiss()" style="font-family: 'Inter', sans-serif;">Cerrar</ion-button>
        </ion-buttons>
      </ion-toolbar>

      <!-- Mensaje de confirmación -->
      <div style="text-align: center; margin-top: 20px; font-size: 38px; font-family: 'Amatic SC', sans-serif; color: white">
        <p>¿Seguro que quieres eliminar tu cuenta?</p>
      </div>

      <!-- Botones "Sí" y "No" -->
      <div style="display: flex; justify-content: center; margin-top: 20px;">
        <ion-button color="danger" (click)="confirmDelete()" style="margin-right: 10px; padding: 10px">Sí</ion-button>
        <ion-button color="medium" (click)="modalConfirm.dismiss()">No</ion-button>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>

<!-- Segundo Modal: Pedir contraseña -->
<ion-modal #modalPassword>
  <ng-template>
    <ion-content>
      <ion-toolbar>
        <ion-title>Confirmar contraseña</ion-title>
      </ion-toolbar>

      <!-- Mensaje de solicitud de contraseña -->
      <div style="text-align: center; margin-top: 20px; font-size: 18px;">
        <p>Por favor, ingresa tu contraseña para confirmar la eliminación.</p>
      </div>

      <!-- Campo de entrada para la contraseña -->
      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="password"></ion-input>
      </ion-item>

      <!-- Botones de acción -->
      <div style="display: flex; justify-content: center; margin-top: 20px;">
        <ion-button color="danger" (click)="borrarCuenta(password)" style="margin-right: 10px;">Eliminar</ion-button>
        <ion-button color="medium" (click)="modalPassword.dismiss()">Cancelar</ion-button>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>





<ion-router-outlet id="main-content"></ion-router-outlet>
