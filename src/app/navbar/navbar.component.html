<ion-header>
  <ion-toolbar color="primario">
    <ion-grid style="padding-top: 18px">
      <ion-row>
        <ion-col>
          <ion-menu-button auto-hide="false" style="padding-top: 20px;" class="medium-icon"></ion-menu-button>
        </ion-col>
        <ion-col style="padding-left: 40px">
          <ion-img src="/assets/Meetify.svg" style="width: 60px;"></ion-img>
        </ion-col>
        <ion-col>
          <ion-icon name="search-outline" style="padding-top: 20px; float: right" class="medium-icon" (click)="toggleSearchInput()"></ion-icon>
        </ion-col>
      </ion-row>

      <!-- Input que aparece cuando isSearchVisible es true -->
      <ion-row *ngIf="isSearchVisible" style="background-color: #F3F7F0;color: black">
        <ion-col>
          <ion-input placeholder="Buscar..." [(ngModel)]="searchQuery"></ion-input>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>

<ion-menu side="start" menuId="first" contentId="main-content" style="height: 100%;">
  <ion-header>
    <ion-toolbar color="primario">
      <ion-buttons slot="start">
        <ion-img src="/assets/Meetify.svg" class="large-icon"></ion-img>
      </ion-buttons>
      <ion-title class="header-title font-amatic-grande2">MENÚ</ion-title>
      <ion-buttons slot="end">
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content class="menu-content" style="height: 100%;">
    <div class="menu-items">
      <ion-list *ngIf="vistaActual === 'main'">
        <ion-item *ngFor="let item of menuItems" (click)="navigateTo(item.route)">
          <ion-icon [name]="item.icon" slot="start" class="menu-icon"></ion-icon>
          <ion-label>{{ item.label }}</ion-label>
        </ion-item>
        <ion-item (click)="setVista('config')">
          <ion-icon name="settings-outline" slot="start" class="menu-icon"></ion-icon>
          <ion-label>Mis actividades y configuración</ion-label>
        </ion-item>
      </ion-list>

      <ion-list *ngIf="vistaActual === 'config'">
        <ion-item (click)="setVista('main')">
          <ion-icon name="arrow-back-circle" slot="start" class="menu-icon"></ion-icon>
          <ion-label>Volver</ion-label>
        </ion-item>
        <ion-item *ngFor="let item of menuActivities" (click)="navigateTo(item.route)">
          <ion-icon [name]="item.icon" slot="start" class="menu-icon"></ion-icon>
          <ion-label>{{ item.label }}</ion-label>
        </ion-item>
      </ion-list>
    </div>
  </ion-content>
</ion-menu>

<ion-router-outlet id="main-content"></ion-router-outlet>
