<app-cabecera titulo="Información"></app-cabecera>

<ion-content class="ion-padding">
  <div class="container" *ngIf="publicacion">
    <div class="image-container">
      <img [src]="publicacion.imagenUrlPub" alt="Imagen" class="ImagenPubli">
    </div>
    <h2>{{ publicacion.titulo }}</h2>

    <div class="profile-container">
      <img [src]="publicacion.imagenUrlPerfil" alt="Perfil" class="profile-pic">
      <div class="profile-info">
        <h3>{{ publicacion.nombrePerfil }}</h3>
        <p>Reputación <strong></strong></p>
      </div>
      <ion-icon name="create-outline" class="more-options" (click)="abrirOpcionesModal()"></ion-icon>
    </div>

    <ion-modal class="modal-opciones" [isOpen]="modalOpciones">
      <ng-template>
        <ion-content>
          <ion-toolbar class="toolbar">
            <ion-title>Opciones</ion-title>
            <ion-buttons slot="end">
              <ion-button (click)="cerrarOpcionesModal()">Cerrar</ion-button>
            </ion-buttons>
          </ion-toolbar>
          <div class="modal-div">
            <ion-button class="boton-opcion" (click)="abrirEditarModal()">Editar</ion-button>
            <ion-button class="boton-opcion danger" (click)="abrirEliminarModal()">Eliminar</ion-button>
          </div>
        </ion-content>
      </ng-template>
    </ion-modal>

    <ion-row class="stats-container">
      <ion-col class="stat">
        <ion-label>
          <span>{{ numeroSeguidores }}</span><br>
          <strong>Seguidores</strong>
        </ion-label>
      </ion-col>
      <ion-col class="stat">
        <ion-label>
          <span></span><br>
          <strong>Reputación</strong>
        </ion-label>
      </ion-col>
    </ion-row>

    <div class="info-section">
      <ion-icon name="location-outline"></ion-icon>
      <strong>Ubicación:</strong> <span>{{ publicacion.ubicacion }}</span>
    </div>

    <div class="info-section">
      <ion-icon name="book-outline"></ion-icon>
      <strong>Categorías:</strong> <span class="category">{{ publicacion.categoria }}</span>
    </div>

    <div class="parent-container">
      <ion-button class="btnReseñas" id="open-modal" (click)="cargarReneias(publicacion.id)">
        <ion-icon name="star-outline"></ion-icon>
        <ion-text>Reseñas</ion-text>
        <ion-icon name="star-outline"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-content>

<app-pie-pagina></app-pie-pagina>
