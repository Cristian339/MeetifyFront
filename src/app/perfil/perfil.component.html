<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button href="/publicacion">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="font-title-size">Mi perfil</ion-title>
    <ion-buttons slot="end">
      <ion-button href="/editar-perfil">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="perfil-content">
  <!-- Sección de la foto de perfil y nombre -->
  <ion-grid class="perfil-grid">
    <ion-row class="perfil-row">
      <ion-col size="12" class="perfil-header">
        <ion-avatar class="perfil-avatar">
          <img src="https://picsum.photos/500/300?random=1" alt="Foto de perfil" width="800" height="300" />
        </ion-avatar>
        <ion-label class="perfil-usuario font-inter">Hector</ion-label>
        <p class="perfil-descripcion">
          Me gusta mucho jugar deporte y salir mucho a lugares turísticos
        </p>
        <ion-label class="perfil-nombre font-inter">Hector Baldibian Antezana</ion-label>
      </ion-col>
    </ion-row>

    <!-- Estadísticas -->
    <ion-row class="perfil-stats font-amatic">
      <ion-col>
        <ion-label class="perfil-stat">
          <strong>315</strong>
          <br>Seguidos
        </ion-label>
      </ion-col>
      <ion-col>

        <ion-label class="perfil-stat">
          <strong>77.5k</strong>
        </ion-label>
          <br>Seguidores
      </ion-col>
      <ion-col>
        <ion-label class="perfil-stat text-bold">
          500
          <br>Eventos
        </ion-label>
      </ion-col>
    </ion-row>

    <!-- Reputación -->
    <ion-row class="perfil-reputacion font-amatic">
      <ion-col>
        <ion-label>
          Reputación <strong>500</strong>
          <ion-icon name="star-outline" class="reputacion-icon"></ion-icon>
          <ion-icon name="trophy-outline" color="warning"></ion-icon>
        </ion-label>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Sección de tabs y publicaciones -->
  <ion-segment value="publicaciones" class="perfil-tabs">
    <ion-segment-button value="eventos">Eventos</ion-segment-button>
    <ion-segment-button value="etiquetado">Etiquetado</ion-segment-button>
  </ion-segment>

  <ion-grid class="publicaciones-grid">
    <ion-row>
      <ion-col size="6">
        <ion-card class="publicacion-card">
          <img src="https://picsum.photos/500/300?random=8" alt="Foto de perfil" width="500" height="300" />
        </ion-card>
      </ion-col>
      <ion-col size="6">
        <ion-card class="publicacion-card">
          <img src="https://picsum.photos/500/300?random=5" alt="Foto de perfil" width="500" height="300" />
        </ion-card>
      </ion-col>
      <ion-col size="6">
        <ion-card class="publicacion-card">
          <img src="https://picsum.photos/500/300?random=3" alt="Foto de perfil" width="500" height="300" />
        </ion-card>
      </ion-col>
      <ion-col size="6">
        <ion-card class="publicacion-card">
          <img src="https://picsum.photos/500/300?random=2" alt="Foto de perfil" width="500" height="300" />
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Botón flotante -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button>
      <ion-icon color="secundario" name="construct-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
