<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-img src="/assets/Meetify.svg" class="logo-image" slot="start"></ion-img>
    </ion-buttons>
    <ion-title class="header-title">CHATS</ion-title>
    <ion-buttons slot="end">
      <ion-icon name="arrow-back-circle" slot="end"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar placeholder="Buscar el mensaje"></ion-searchbar>

  <ion-list>
    <ion-item *ngFor="let seguidor of filteredSeguidos" lines="none" (click)="abrirChat(seguidor.id!)">
      <ion-avatar slot="start">
        <ion-img *ngIf="seguidor.imagenUrlPerfil; else defaultIcon" [src]="seguidor.imagenUrlPerfil"></ion-img>
        <ng-template #defaultIcon>
          <ion-icon name="person-outline" class="circuloPersona"></ion-icon>
        </ng-template>
      </ion-avatar>
      <ion-label>
        <h2>{{ seguidor.nombre }}</h2>
      </ion-label>
      <ion-icon name="chatbubbles-outline" slot="end"></ion-icon>
    </ion-item>
  </ion-list>

  <ion-modal #modal [isOpen]="roomId !== ''" [enterAnimation]="entrarAnimacion" [leaveAnimation]="dejarAnimacion" (ionModalDidDismiss)="disconnectWebSocket()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-avatar slot="start">
            <ion-img *ngIf="currentSeguidor?.imagenUrlPerfil; else defaultIcon" [src]="currentSeguidor?.imagenUrlPerfil"></ion-img>
            <ng-template #defaultIcon>
              <ion-icon class="Perfil-imagen" name="person-outline"></ion-icon>
            </ng-template>
          </ion-avatar>
          <ion-label>
            <h2>{{ currentSeguidor?.nombre }}</h2>
            <p>Conectado</p>
          </ion-label>
          <ion-icon name="arrow-back-circle" slot="end" (click)="modal.dismiss()"></ion-icon>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <div class="chat-container">
          <div *ngFor="let message of messages[roomId]">
            <div class="date-label">{{ formatDate(message.fechaEnviado) }}</div>
            <div [ngClass]="{'message-sent': message.usuarioEmisor.id === 1, 'message-received': message.usuarioEmisor.id !== 1}">
              {{ message.contenido }}
            </div>
          </div>
        </div>
      </ion-content>

      <ion-footer style="background-color: #FFFFFF">
        <ion-toolbar style="background-color: #FFFFFF">
          <ion-item lines="none">
            <ion-input type="text" placeholder="Escribe un mensaje" [(ngModel)]="newMessage"></ion-input>
            <ion-icon slot="end" name="send-outline" (click)="enviarMensaje()"></ion-icon>
          </ion-item>
        </ion-toolbar>
      </ion-footer>
    </ng-template>
  </ion-modal>
</ion-content>
