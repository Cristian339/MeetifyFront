<ion-app>
  <div class="ion-page" id="main-content">
    <app-cabecera titulo="Mas información!" ruta="/publicacion" class="no-margin"></app-cabecera>


    <ion-content class="ion-padding">
      <div class="container" *ngIf="publicacion">
        <div class="image-container">
          <img [src]="publicacion.imagenUrlPub" alt="Imagen">
        </div>
        <h2>{{ publicacion.titulo }}</h2>

        <div class="profile-container">
          <img [src]="publicacion.imagenUrlPerfil" alt="Perfil" class="profile-pic">
          <div class="profile-info">
            <h3>{{ publicacion.nombrePerfil }}</h3>
            <p>Reputación <strong></strong></p>
          </div>
          <ion-button color="primario" (click)="unirseEvento()" *ngIf="!dentro">
            Seguir Evento
          </ion-button>
          <ion-button color="danger" (click)="salirPublicacion(publicacion)" *ngIf="dentro">
            Salir del evento
          </ion-button>

        </div>
        <div class="stats-container">
          <div><strong>Reputación</strong><br></div>
        </div>

        <div class="location">
          <ion-icon name="location-outline"></ion-icon>
          <strong> Ubicación: </strong>
          <span>{{ publicacion.ubicacion }}</span>
        </div>

        <div class="categories">
          <ion-icon name="book-outline"></ion-icon>
          <strong> Categorías: </strong>
          <span class="category">{{ publicacion.categoria }}</span>
        </div>
      </div>
    </ion-content>
    <app-pie-pagina></app-pie-pagina>
  </div>


</ion-app>
