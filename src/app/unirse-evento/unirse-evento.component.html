<ion-app>
  <div class="ion-page" id="main-content">
    <ion-header>
      <ion-toolbar color="primario">
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-grid>
          <ion-row>
            <ion-col size="auto" style="padding-left: 40px;">
              <ion-img src="/assets/Meetify.svg" style="width: 60px; margin-left: 120%"></ion-img>
            </ion-col>
            <ion-col size="auto" slot="end">
              <ion-buttons slot="end">
                <ion-icon name="arrow-back-circle" slot="end" routerLink="/publicacion"></ion-icon>
              </ion-buttons>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <div class="container" *ngIf="publicacion">
        <div class="image-container">
          <img [src]="publicacion.imagenUrlPub" alt="Imagen">
          <ion-icon name="camera-outline" class="camera-icon"></ion-icon>
        </div>
        <h2>{{ publicacion.titulo }}</h2>

        <div class="profile-container">
          <img [src]="publicacion.imagenUrlPerfil" alt="Perfil" class="profile-pic">
          <ion-icon name="camera-outline" class="profile-camera"></ion-icon>
          <div class="profile-info">
            <h3>{{ publicacion.nombrePerfil }}</h3>
            <p>Reputación <strong></strong></p>
          </div>
          <ion-button (click)="unirseEvento()" *ngIf="!dentro">
            Seguir Evento
          </ion-button>
          <ion-button color="danger" (click)="salirPublicacion(publicacion)" *ngIf="dentro">
            Salir del evento
          </ion-button>

        </div>
        <div class="stats-container">
          <div><strong>Reputación</strong><br></div>
        </div>

        <div class="location">
          <ion-icon name="location-outline"></ion-icon>
          <strong> Ubicación: </strong>
          <span>{{ publicacion.ubicacion }}</span>
        </div>

        <div class="categories">
          <ion-icon name="book-outline"></ion-icon>
          <strong> Categorías: </strong>
          <span class="category">{{ publicacion.categoria }}</span>
        </div>
      </div>
    </ion-content>
    <app-pie-pagina></app-pie-pagina>
  </div>


</ion-app>
