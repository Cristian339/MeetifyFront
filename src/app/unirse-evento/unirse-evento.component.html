<app-cabecera titulo="Unirse"></app-cabecera>

<ion-content class="ion-padding" style="background-color: #5497A7">
      <div class="container" *ngIf="publicacion">
        <div class="image-container">
          <img [src]="publicacion.imagenUrlPub" alt="Imagen" class="ImagenPubli">
        </div>
        <h2>{{ publicacion.titulo }}</h2>

        <div class="profile-container">
          <img [src]="publicacion.imagenUrlPerfil" alt="Perfil" class="profile-pic">
          <div class="profile-info">
            <h3>{{ publicacion.nombrePerfil }}</h3>
            <p>Reputación <strong></strong></p>
          </div>
          <ion-button class="follow-btn" color="primario" (click)="unirseEvento()" *ngIf="!dentro">
            Seguir Evento
          </ion-button>
          <ion-button class="salir-btn" color="danger" (click)="salirPublicacion(publicacion)" *ngIf="dentro">
            Salir del evento
          </ion-button>

        </div>
        <div class="stats-container font-amatic">
          <div class="evento-stat">
            <span></span>
            <br><strong>Reputación</strong><br>
          </div>
        </div>

        <div class="location">
          <ion-icon name="location-outline"></ion-icon>
          <strong> Ubicación: </strong>
          <span>{{ publicacion.ubicacion }}</span>
        </div>

        <div class="categories">
          <ion-icon name="book-outline"></ion-icon>
          <strong> Categorías: </strong>
          <span class="category">{{ publicacion.categoria }}</span>
        </div>

        <div class="parent-container">
          <ion-button class="btnReseñas" id="open-modal" (click)="cargarReneias(publicacion.id)">
            <ion-icon name="star-outline" class="icon-gap"></ion-icon>
            <ion-text>Reseñas</ion-text>
            <ion-icon name="star-outline" class="icon-gap"></ion-icon>
          </ion-button>
        </div>
      </div>



  <ion-modal #modal trigger="open-modal" [presentingElement]="presentingElement">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Reseñas</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="modal.dismiss()">Close</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list>
          <div class="Reseña">
            <ion-item *ngFor="let r of resenias" class="review-item">
              <!-- Imagen grande del usuario -->
              <ion-avatar slot="start" class="review-avatar">
                <ion-img [src]="r.imagenUrlUsuario"></ion-img>
              </ion-avatar>

              <!-- Contenedor de información (nombre + estrellas + puntuación) -->
              <div class="review-info">
                <h2 class="review-name">{{ r.nombreUsuario }}</h2>

                <!-- Estrellas + Puntuación en una sola línea -->
                <div class="review-rating">
                  <div class="score">{{ (r.estrellas ?? 0) * 5 }} / 25 PTS</div>
                  <div class="review-stars">
                    <ng-container *ngFor="let star of [1, 2, 3, 4, 5]">
                      <img
                        [src]="star <= (r.estrellas ?? 0) ? 'assets/icon/EstrellaRellena.svg' : 'assets/icon/EstrellaVacia.svg'"
                        alt="Estrella"
                        class="star-icon"
                      />
                    </ng-container>
                  </div>
                </div>
                <ion-text readonly>Motivo: {{r.motivo}}</ion-text>
              </div>

            </ion-item>


          </div>

        </ion-list>
      </ion-content>
    </ng-template>
  </ion-modal>


</ion-content>
    <app-pie-pagina class="Pie"></app-pie-pagina>
