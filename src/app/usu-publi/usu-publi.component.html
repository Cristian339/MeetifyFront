<app-cabecera titulo="Publicaciones de: {{correo}}"></app-cabecera>

<ion-content>
  <ion-card *ngFor="let p of publicaciones" class="card-evento">

    <ion-grid style="float: left">
      <ion-row>
        <ion-col>
          <ng-container *ngIf="p.imagenUrlPerfil; else defaultIcon" >
            <img [src]="p.imagenUrlPerfil" alt="Profile Image" class="circular-image" style="margin-top: 5px" (click)="entrarPerfil(p.id)"/>
          </ng-container>
          <ng-template #defaultIcon>
            <ion-icon name="person-circle-outline" style="margin-top: 5px" size="large" class="Perfil" (click)="entrarPerfil(p.id)"></ion-icon>
          </ng-template>
        </ion-col>
        <ion-row class="centered-text">
          <p class="nombre-perfil"><i>{{p.nombrePerfil}}</i></p>
          <p class="categoria"><i>{{p.categoria}}</i></p>
        </ion-row>
      </ion-row>
    </ion-grid>

    <img alt="Imagen" [src]="p.imagenUrlPub ? p.imagenUrlPub : 'https://ionicframework.com/docs/img/demos/card-media.png'" class="ImagenPub"/>
    <ion-title class="titulo" color="primario"><i>{{p.titulo}}</i></ion-title>
    <ion-card-content class="descripcion"><i>{{p.descripcion}}</i></ion-card-content>
    <ion-text>
      <ion-icon name="calendar-outline" class="icono"></ion-icon><i class="fecha"> Inicio: {{ p.fechaIni | date:'yyyy-MM-dd' }}</i> <ion-icon name="calendar-outline" class="icono" style="margin-left: 10px"></ion-icon><i class="fecha"> Fin: {{ p.fechaFin | date:'yyyy-MM-dd' }}</i>
    </ion-text>
    <ion-text>
      <ion-icon name="golf-outline" class="icono"></ion-icon><i class="fecha">{{p.ubicacion}}</i>
    </ion-text>

    <ion-grid>
      <ion-row>
        <ion-col size="12" style="text-align: center; margin-top: 3%">
          <ion-button fill="solid" color="danger" (click)="eliminarPublicacion(p.id)">Eliminar</ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>

  </ion-card>
</ion-content>
