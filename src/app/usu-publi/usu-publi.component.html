<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/administracion"></ion-back-button>
    </ion-buttons>
    <ion-title>Publicaciones de {{ correo }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card *ngFor="let p of publicaciones" style="margin-top: 20px; box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3); font-family: 'Inter', sans-serif; position: relative;">

    <ion-grid style="float: left">
      <ion-row>
        <ion-col>
          <ion-icon name="person-circle-outline" style="margin-top: 5px" size="large"></ion-icon>
        </ion-col>
        <ion-row style="display: block">
          <p style="color: #19323C"><i>{{ p.nombrePerfil }}</i></p>
          <p><i>{{ p.categoria }}</i></p>
        </ion-row>
      </ion-row>
    </ion-grid>

    <img [src]="p.imageUrl || '/assets/placeholder.jpg'" alt="Publicación" style="margin-top: 10px"/>
    <ion-title style="margin-top: 10px;" color="primario"><i>{{ p.titulo }}</i></ion-title>
    <ion-card-content style="margin-left: 4px"><i>{{ p.descripcion }}</i></ion-card-content>

    <ion-text style="padding-left: 15px; display: block; color: black">
      <ion-icon name="calendar-outline"></ion-icon> Inicio: <i>{{ p.fechaIni | date:'yyyy-MM-dd' }}</i>
      <ion-icon name="calendar-outline" style="margin-left: 10px"></ion-icon> Fin: <i>{{ p.fechaFin | date:'yyyy-MM-dd' }}</i>
    </ion-text>

    <ion-text style="padding-left: 15px; display: block; margin-top: 5px; color: black">
      <ion-icon name="golf-outline"></ion-icon> <i>{{ p.ubicacion }}</i>
    </ion-text>

    <ion-grid>
      <ion-row>
        <ion-col size="12" style="text-align: center;">
          <ion-button fill="solid" color="danger" (click)="eliminarPublicacion(p.id)">Eliminar</ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>

  </ion-card>
</ion-content>
