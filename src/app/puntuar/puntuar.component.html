<app-cabecera [titulo]="'Puntuar'" [ruta]="'/publicacion'"></app-cabecera>

<ion-content class="content-container">
  <ion-grid class="rating-container">
    <ion-row>
      <ion-col size="12">
        <ion-title class="title">DANOS TU VALORACIÓN</ion-title>
      </ion-col>
    </ion-row>

    <div class="flex-container">
      <!-- Tarjeta de Publicación -->
      <div class="group-card">
        <div class="group-info">
          <img [src]="p.imagenUrlPerfil" alt="Perfil" class="group-avatar"/>
          <div class="group-details">
            <h3>{{ p.titulo }}</h3>
            <p>Creado por: <strong>{{ p.nombrePerfil }}</strong></p>
          </div>
        </div>

        <img [src]="p.imagenUrlPub" alt="Publicación" class="cover-image"/>
        <div class="category-button">{{ p.categoria }}</div>
      </div>

      <!-- Sección de valoración -->
      <div class="right-section">
        <ion-row class="rating-section">
          <ion-col size="12">
            <ion-text class="font-amatic">Valoración:</ion-text>
            <div class="stars">
              <img *ngFor="let star of [1,2,3,4,5]"
                   src="assets/icon/EstrellaVacia.svg"
                   (click)="rate(star)"
                   [ngClass]="{ 'filled': star <= puntuacion }"
                   class="star-icon">
            </div>
            <div class="score">{{ puntuacion * 5 }} / 25 PTS</div>
          </ion-col>
        </ion-row>

        <!-- Razón de la puntuación -->
        <ion-row class="reason-section">
          <ion-col size="12">
            <ion-text class="font-amatic">Razón de la puntuación:</ion-text>
            <ion-textarea class="reason-textarea" placeholder="Motivos (OPCIONAL)" [(ngModel)]="razon"></ion-textarea>
          </ion-col>
        </ion-row>
      </div>
    </div>

    <ion-row>
      <ion-col size="12">
        <ion-button expand="block" class="submit-button" (click)="subirValoracion()">Puntuar</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
